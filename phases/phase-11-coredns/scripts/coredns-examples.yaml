# CoreDNS Examples — YAML manifests cho Phase 11 exercises

# ─── 1. Debug Pod với DNS tools ───────────────────────────────────────────────
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-debug
  namespace: default
  labels:
    purpose: dns-debug
spec:
  dnsPolicy: ClusterFirst
  containers:
  - name: debug
    image: tutum/dnsutils:latest   # Có sẵn dig, nslookup, host
    command: [sleep, "3600"]

---
# ─── 2. Debug Pod busybox (nhẹ hơn) ──────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: dns-debug-busybox
  namespace: default
spec:
  dnsPolicy: ClusterFirst
  containers:
  - name: debug
    image: busybox:1.36
    command: [sleep, "3600"]

---
# ─── 3. ClusterIP Service + Deployment ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80

---
# ─── 4. Headless Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: default
spec:
  clusterIP: None    # Headless
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80

---
# ─── 5. StatefulSet với Headless Service ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres-headless    # Must match Headless Service name
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "password123"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

---
# ─── 6. ExternalName Service ─────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: external-db
  namespace: default
spec:
  type: ExternalName
  externalName: database.example.com
  ports:
  - port: 5432

---
# ─── 7. Pod với dnsPolicy: None (custom DNS) ─────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: custom-dns-pod
  namespace: default
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
    - 8.8.8.8
    - 8.8.4.4
    searches:
    - custom.internal
    options:
    - name: ndots
      value: "2"
  containers:
  - name: debug
    image: busybox:1.36
    command: [sleep, "3600"]

---
# ─── 8. Pod với hostNetwork + ClusterFirstWithHostNet ─────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: hostnet-pod
  namespace: default
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet    # Must use this with hostNetwork
  containers:
  - name: debug
    image: busybox:1.36
    command: [sleep, "3600"]

---
# ─── 9. Service với named ports (SRV record) ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-with-ports
  namespace: default
spec:
  selector:
    app: api
  ports:
  - name: http       # → SRV: _http._tcp.api-with-ports.default.svc.cluster.local
    port: 80
    targetPort: 8080
  - name: grpc       # → SRV: _grpc._tcp.api-with-ports.default.svc.cluster.local
    port: 9090
    targetPort: 9090
  - name: metrics    # → SRV: _metrics._tcp.api-with-ports.default.svc.cluster.local
    port: 9153
    targetPort: 9153

---
