# kube-proxy Examples — YAML manifests for all exercises
#
# Apply individual sections or the whole file:
#   kubectl apply -f kube-proxy-examples.yaml

# =============================================================================
# Exercise 01/02: Deployment + ClusterIP Service (3 replicas)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

# =============================================================================
# Exercise 03: NodePort Service
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP

# =============================================================================
# Exercise 03: LoadBalancer Service (cloud)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

# =============================================================================
# ExternalName Service (DNS CNAME to external)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  type: ExternalName
  externalName: db.example.com

# =============================================================================
# Headless Service (for StatefulSet)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-headless
spec:
  clusterIP: None
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

# =============================================================================
# StatefulSet + Headless Service (individual pod DNS)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-stateful
spec:
  clusterIP: None
  selector:
    app: web-stateful
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
spec:
  serviceName: web-stateful
  replicas: 3
  selector:
    matchLabels:
      app: web-stateful
  template:
    metadata:
      labels:
        app: web-stateful
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80

# =============================================================================
# Service without selector (manual endpoints)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: external-service
spec:
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-service
subsets:
- addresses:
  - ip: 192.168.1.100
  ports:
  - port: 80

# =============================================================================
# Multi-port Service
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-multiport
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP

# =============================================================================
# UDP Service (DNS example)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: dns-service
spec:
  selector:
    app: dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP

# =============================================================================
# Session Affinity (sticky session via client IP)
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: web-sticky
spec:
  selector:
    app: web
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800   # 3 hours sticky
  ports:
  - port: 80
    targetPort: 80

# =============================================================================
# Client pod for testing
# =============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
