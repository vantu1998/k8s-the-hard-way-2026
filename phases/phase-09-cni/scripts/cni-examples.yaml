# =============================================================================
# Exercise 01: Test pod for bridge CNI
# =============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: bridge-test
  labels:
    app: bridge-test
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    ports:
    - containerPort: 80

