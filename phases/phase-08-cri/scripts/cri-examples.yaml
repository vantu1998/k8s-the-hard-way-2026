# =============================================================================
# Pod with init container (sandbox + init + app)
# =============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  labels:
    app: init-container-demo
spec:
  volumes:
  - name: workdir
    emptyDir: {}
  initContainers:
  - name: init
    image: busybox:1.36
    volumeMounts:
    - name: workdir
      mountPath: /work
    command:
    - sh
    - -c
    - "echo 'init done' > /work/ready.txt"
  containers:
  - name: app
    image: nginx:1.25
    volumeMounts:
    - name: workdir
      mountPath: /usr/share/nginx/html

# =============================================================================
# Pod with resource limits (QoS: Guaranteed)
# =============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-qos
  labels:
    app: guaranteed-qos
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m          # request == limit → Guaranteed
        memory: 256Mi      # request == limit → Guaranteed

# =============================================================================
# Pod with resource limits (QoS: Burstable)
# =============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: burstable-qos
  labels:
    app: burstable-qos
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m          # request < limit → Burstable
        memory: 256Mi      # request < limit → Burstable

