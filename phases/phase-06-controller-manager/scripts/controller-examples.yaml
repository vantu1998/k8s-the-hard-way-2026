# Controller Examples — YAML manifests for all exercises
#
# Apply individual sections or the whole file:
#   kubectl apply -f controller-examples.yaml

# =============================================================================
# Exercise 01: Deployment for scale testing
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

# =============================================================================
# Exercise 02: Deployment with rolling update strategy
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-rolling
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-rolling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-rolling
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

# =============================================================================
# Exercise 04: Deployment + DaemonSet for cordon/drain
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-drain
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-drain
  template:
    metadata:
      labels:
        app: web-drain
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.16
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

# =============================================================================
# Exercise 05: Job with completions and parallelism
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-calc
spec:
  completions: 5
  parallelism: 2
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: pi
        image: perl:5.34
        command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(100)"]

# =============================================================================
# Exercise 05: Job with podFailurePolicy
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-job
spec:
  completions: 3
  parallelism: 1
  backoffLimit: 10
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        values: [42]
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: app
        image: busybox
        command: ["sh", "-c", "exit 42"]

# =============================================================================
# Exercise 05: Job with activeDeadlineSeconds (timeout)
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: timeout-job
spec:
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 10
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sleep
        image: busybox
        command: ["sleep", "300"]

# =============================================================================
# Exercise 05: Job with TTL after finished
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ttl-job
spec:
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: pi
        image: perl:5.34
        command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(50)"]

# =============================================================================
# Exercise 05: CronJob — scheduled backup
# =============================================================================

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 2 * * *"
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completions: 1
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: busybox
            command: ["sh", "-c", "echo 'Running backup...' && sleep 10"]

# =============================================================================
# Exercise 06: ConfigMap for simple controller
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-controller-config
  namespace: default
data:
  greeting.txt: "Hello from Kubernetes!"
  message.txt: "This file is managed by a custom controller."

# =============================================================================
# Namespace with ResourceQuota and LimitRange
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-dev
  namespace: dev
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
    services: "20"
    configmaps: "100"
    secrets: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits-dev
  namespace: dev
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 2000m
      memory: 2Gi
    min:
      cpu: 50m
      memory: 64Mi
